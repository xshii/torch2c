- id: ST6
  desc: Q/K 投影 + 注意力打分，per-op 溢出 → tiled 策略
  graph: |
    input[1,640,256] → q_proj(W[256,256]+b) → Q[1,640,256]
    input → k_proj(W[256,256]+b) → K[1,640,256]
    Q → reformat(ND→NZ) → Q_NZ
    K → transpose → K^T[1,256,640] → reformat(ND→NZ) → K^T_NZ
    Q_NZ @ K^T_NZ → scores[1,640,640]
  sizes: activation=320KB, weight=128KB
  tiling:
    - node_0 (q_proj): M 维 640→2×320
    - node_1 (k_proj): M 维 640→2×320
    - reformat_t_7: M 维 256→2×128
    - node_3 (attn): M 维 640→5×128
  strategy: bulk 失败 → per-op 失败 → spill（selective eviction + M 维切分）
  verify:
    - spill 策略：Belady's optimal eviction + 4 个节点需要 M 维 tiling
    - tiled 节点 local tensor 降级为 hbm，独立 L1 layout
    - inline tensor descriptor（绕过 struct 指针碰撞）
    - negative dim 解析：transpose dim0=-1,dim1=-2 → dim0=2,dim1=1
    - C golden 通过（atol=0.05，FP16 256-dim dot product 量化误差 ~0.03）
    - cosine > 0.999
  expect: pass
  precision: max_abs≈0.034, cosine=1.000（FP16 inherent quantization error for d=256）
  ut: TestST6_MHATiled (6 tests) ✅
  st: TestST6_MHATiledE2E (1 test) ✅ compile + C golden (atol=0.05)
