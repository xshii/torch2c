# 系统级测试场景 (ST)
# L1 = 1M (1,048,576 bytes)，所有场景统一
# UT: torch2c/memory_planner/tests/test_st_scenarios.py (57 tests, all passed)
# ST: torch2c/integration/tests/demo_st/test_st_scenarios.py (7 passed)

- id: ST1
  desc: embedding+bias，输入输出权重完全放得下，golden通过
  graph: input[1,32,128] × W[128,128] + b → output[1,32,128]
  sizes: input=8KB, weight=32KB, bias=256B, output=8KB, total≈48KB
  strategy: bulk（全放下，一次性 DMA）
  verify:
    - L1 offset 全部唯一（不复用）
    - HBM 线性递增分配
    - bulk DMA（__bulk_load__ + __bulk_store__）
    - format_annotation 声明 nz 格式（DMA 硬件随路转换）
    - cube_matmul_bias 融合（bias 在 absorbed_inputs）
    - post_validate 通过
  expect: pass
  ut: TestST1_EmbeddingBiasBulk (6 tests) ✅
  st: TestST1_EmbeddingBiasE2E (2 tests) ✅ compile + C golden + 精度

