  verify:
    - spill 策略成功编译（Belady's optimal eviction + tiling）
    - C golden 通过
  expect: pass
  ut: TestST3_EmbeddingBiasTiled (2 tests) ✅
  st: TestST3_EmbeddingBiasTiledE2E (1 test) ✅ compile + C golden

