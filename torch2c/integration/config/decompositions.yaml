# 算子裂解规则：按 npu_op 查表，将复合 NPU 算子拆为多步原子操作
# key = npu_op（经 op_mapping 命名映射后的名称）
# 不在此表中的 npu_op 视为硬件原生支持，直接确认 is_mapped=True
# 若硬件升级原生支持了某指令，删除对应条目即可

decompositions:
  # vector_layernorm → part1（均值/方差）+ part2（归一化 + scale/bias）
  vector_layernorm:
    steps:
      - npu_op: vector_layernorm_part1
        compute_unit: vector
      - npu_op: vector_layernorm_part2
        compute_unit: vector
        extra_inputs: ["original.0"]

  # vector_softmax → part1（max/sub）+ part2（exp/sum/div）
  vector_softmax:
    steps:
      - npu_op: vector_softmax_part1
        compute_unit: vector
      - npu_op: vector_softmax_part2
        compute_unit: vector
