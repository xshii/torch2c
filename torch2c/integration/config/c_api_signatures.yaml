# NPU C API 函数签名
#
# 约定：
#   - 函数名以计算单元为前缀: cube_ / vector_ / dma_ / idma_
#   - type: tensor_desc  → 生成 (npu_tensor_t){addr >> addr_shift, dtype_enum, format_enum}
#     source 引用的 tensor 自动展开三个字段
#   - addr_shift 由 l1 alignment 决定（32B → 5位）
#   - compute_dtype 指定算子计算精度
#   - 所有 compute_ops 第一个参数隐含 TidInfo tid（codegen 自动注入）
#   - 依赖关系通过 TidInfo 的 dep_cube_tid/dep_vector_tid/dep_dma_tid/dep_idma_tid 表达
#     dep=0 表示无依赖，不再需要独立的 sync_ops

compute_ops:

  # ---- cube ----

  cube_matmul:
    unit: cube
    params:
      - { name: "a",   type: "tensor_desc", source: "tensor.input_0" }
      - { name: "b",   type: "tensor_desc", source: "tensor.input_1" }
      - { name: "out", type: "tensor_desc", source: "tensor.output_0" }
      - { name: "loop", type: "int",        source: "param.loop", default: 1 }
      - { name: "m",    type: "int",        source: "tensor.input_0.shape.-2" }
      - { name: "n",    type: "int",        source: "tensor.output_0.shape.-1" }
      - { name: "k",    type: "int",        source: "tensor.input_0.shape.-1" }
      - { name: "transpose_b", type: "int", source: "param.transpose_b", default: 0 }
      - { name: "compute_dtype", type: "dtype_enum", source: "param.compute_dtype", default: "fp16" }

  cube_matmul_bias:
    unit: cube
    params:
      - { name: "a",    type: "tensor_desc", source: "tensor.input_0" }
      - { name: "b",    type: "tensor_desc", source: "tensor.input_1" }
      - { name: "bias", type: "tensor_desc", source: "tensor.input_2" }
      - { name: "out",  type: "tensor_desc", source: "tensor.output_0" }
      - { name: "loop", type: "int",         source: "param.loop", default: 1 }
      - { name: "m",    type: "int",         source: "tensor.input_0.shape.-2" }
      - { name: "n",    type: "int",         source: "tensor.output_0.shape.-1" }
      - { name: "k",    type: "int",         source: "tensor.input_0.shape.-1" }
      - { name: "transpose_b", type: "int",  source: "param.transpose_b", default: 0 }
      - { name: "compute_dtype", type: "dtype_enum", source: "param.compute_dtype", default: "fp16" }

  # ---- vector: arithmetic ----

  vector_add:
    unit: vector
    params:
      - { name: "a",   type: "tensor_desc", source: "tensor.input_0" }
      - { name: "b",   type: "tensor_desc", source: "tensor.input_1" }
      - { name: "out", type: "tensor_desc", source: "tensor.output_0" }
      - { name: "count", type: "int",       source: "tensor.input_0.elem_count" }
      - { name: "compute_dtype", type: "dtype_enum", source: "param.compute_dtype", default: "fp16" }

  vector_sub:
    unit: vector
    params:
      - { name: "a",   type: "tensor_desc", source: "tensor.input_0" }
      - { name: "b",   type: "tensor_desc", source: "tensor.input_1" }
      - { name: "out", type: "tensor_desc", source: "tensor.output_0" }
      - { name: "count", type: "int",       source: "tensor.input_0.elem_count" }
      - { name: "compute_dtype", type: "dtype_enum", source: "param.compute_dtype", default: "fp16" }

  vector_mul:
    unit: vector
    params:
      - { name: "a",   type: "tensor_desc", source: "tensor.input_0" }
      - { name: "b",   type: "tensor_desc", source: "tensor.input_1" }
      - { name: "out", type: "tensor_desc", source: "tensor.output_0" }
      - { name: "count", type: "int",       source: "tensor.input_0.elem_count" }
      - { name: "compute_dtype", type: "dtype_enum", source: "param.compute_dtype", default: "fp16" }

  vector_div:
    unit: vector
    params:
      - { name: "a",   type: "tensor_desc", source: "tensor.input_0" }
      - { name: "b",   type: "tensor_desc", source: "tensor.input_1" }
      - { name: "out", type: "tensor_desc", source: "tensor.output_0" }
      - { name: "count", type: "int",       source: "tensor.input_0.elem_count" }
      - { name: "compute_dtype", type: "dtype_enum", source: "param.compute_dtype", default: "fp16" }

  vector_mul_scalar:
    unit: vector
    params:
      - { name: "input", type: "tensor_desc", source: "tensor.input_0" }
      - { name: "out",   type: "tensor_desc", source: "tensor.output_0" }
      - { name: "scalar", type: "float",      source: "param.scalar_value" }
      - { name: "count",  type: "int",        source: "tensor.input_0.elem_count" }
      - { name: "compute_dtype", type: "dtype_enum", source: "param.compute_dtype", default: "fp16" }

  vector_fill:
    unit: vector
    params:
      - { name: "out",   type: "tensor_desc", source: "tensor.output_0" }
      - { name: "value", type: "float",       source: "param.fill_value" }
      - { name: "count", type: "int",         source: "tensor.output_0.elem_count" }
      - { name: "compute_dtype", type: "dtype_enum", source: "param.compute_dtype", default: "fp16" }

  # ---- vector: activation & regularization ----

  vector_gelu:
    unit: vector
    params:
      - { name: "input", type: "tensor_desc", source: "tensor.input_0" }
      - { name: "out",   type: "tensor_desc", source: "tensor.output_0" }
      - { name: "count", type: "int",         source: "tensor.input_0.elem_count" }
      - { name: "compute_dtype", type: "dtype_enum", source: "param.compute_dtype", default: "fp16" }

  vector_dropout:
    unit: vector
    params:
      - { name: "input", type: "tensor_desc", source: "tensor.input_0" }
      - { name: "out",   type: "tensor_desc", source: "tensor.output_0" }
      - { name: "mask",  type: "tensor_desc", source: "tensor.input_1" }
      - { name: "count", type: "int",         source: "tensor.input_0.elem_count" }
      - { name: "scale", type: "float",       source: "param.dropout_scale" }
      - { name: "compute_dtype", type: "dtype_enum", source: "param.compute_dtype", default: "fp16" }

  # ---- vector: normalization ----

  vector_softmax:
    unit: vector
    params:
      - { name: "input", type: "tensor_desc", source: "tensor.input_0" }
      - { name: "out",   type: "tensor_desc", source: "tensor.output_0" }
      - { name: "dim",   type: "int",         source: "param.dim" }
      - { name: "count", type: "int",         source: "tensor.input_0.elem_count" }
      - { name: "compute_dtype", type: "dtype_enum", source: "param.compute_dtype", default: "fp16" }

  vector_softmax_part1:
    unit: vector
    params:
      - { name: "input", type: "tensor_desc", source: "tensor.input_0" }
      - { name: "out",   type: "tensor_desc", source: "tensor.output_0" }
      - { name: "dim",   type: "int",         source: "param.dim" }
      - { name: "count", type: "int",         source: "tensor.input_0.elem_count" }
      - { name: "compute_dtype", type: "dtype_enum", source: "param.compute_dtype", default: "fp16" }

  vector_softmax_part2:
    unit: vector
    params:
      - { name: "inter", type: "tensor_desc", source: "tensor.input_0" }
      - { name: "out",   type: "tensor_desc", source: "tensor.output_0" }
      - { name: "size",  type: "int",         source: "tensor.input_0.hbm_size" }
      - { name: "compute_dtype", type: "dtype_enum", source: "param.compute_dtype", default: "fp16" }

  vector_layernorm:
    unit: vector
    params:
      - { name: "input", type: "tensor_desc", source: "tensor.input_0" }
      - { name: "gamma", type: "tensor_desc", source: "tensor.input_1" }
      - { name: "beta",  type: "tensor_desc", source: "tensor.input_2" }
      - { name: "out",   type: "tensor_desc", source: "tensor.output_0" }
      - { name: "hidden", type: "int",        source: "tensor.input_0.shape.-1" }
      - { name: "seq",    type: "int",        source: "tensor.input_0.shape.-2" }
      - { name: "eps",    type: "float",      source: "param.epsilon" }
      - { name: "compute_dtype", type: "dtype_enum", source: "param.compute_dtype", default: "fp16" }

  vector_layernorm_part1:
    unit: vector
    params:
      - { name: "input", type: "tensor_desc", source: "tensor.input_0" }
      - { name: "gamma", type: "tensor_desc", source: "tensor.input_1" }
      - { name: "beta",  type: "tensor_desc", source: "tensor.input_2" }
      - { name: "out",   type: "tensor_desc", source: "tensor.output_0" }
      - { name: "hidden", type: "int",        source: "tensor.input_0.shape.-1" }
      - { name: "seq",    type: "int",        source: "tensor.input_0.shape.-2" }
      - { name: "eps",    type: "float",      source: "param.epsilon" }
      - { name: "compute_dtype", type: "dtype_enum", source: "param.compute_dtype", default: "fp16" }

  vector_layernorm_part2:
    unit: vector
    params:
      - { name: "inter", type: "tensor_desc", source: "tensor.input_0" }
      - { name: "orig",  type: "tensor_desc", source: "tensor.input_1" }
      - { name: "out",   type: "tensor_desc", source: "tensor.output_0" }
      - { name: "size",  type: "int",         source: "tensor.input_0.hbm_size" }
      - { name: "compute_dtype", type: "dtype_enum", source: "param.compute_dtype", default: "fp16" }

  vector_rmsnorm:
    unit: vector
    params:
      - { name: "input", type: "tensor_desc", source: "tensor.input_0" }
      - { name: "gamma", type: "tensor_desc", source: "tensor.input_1" }
      - { name: "out",   type: "tensor_desc", source: "tensor.output_0" }
      - { name: "hidden", type: "int",        source: "tensor.input_0.shape.-1" }
      - { name: "seq",    type: "int",        source: "tensor.input_0.shape.-2" }
      - { name: "eps",    type: "float",      source: "param.epsilon" }
      - { name: "compute_dtype", type: "dtype_enum", source: "param.compute_dtype", default: "fp16" }

  vector_rmsnorm_part1:
    unit: vector
    params:
      - { name: "input", type: "tensor_desc", source: "tensor.input_0" }
      - { name: "gamma", type: "tensor_desc", source: "tensor.input_1" }
      - { name: "out",   type: "tensor_desc", source: "tensor.output_0" }
      - { name: "hidden", type: "int",        source: "tensor.input_0.shape.-1" }
      - { name: "seq",    type: "int",        source: "tensor.input_0.shape.-2" }
      - { name: "eps",    type: "float",      source: "param.epsilon" }
      - { name: "compute_dtype", type: "dtype_enum", source: "param.compute_dtype", default: "fp16" }

  vector_rmsnorm_part2:
    unit: vector
    params:
      - { name: "inter", type: "tensor_desc", source: "tensor.input_0" }
      - { name: "orig",  type: "tensor_desc", source: "tensor.input_1" }
      - { name: "out",   type: "tensor_desc", source: "tensor.output_0" }
      - { name: "size",  type: "int",         source: "tensor.input_0.hbm_size" }
      - { name: "compute_dtype", type: "dtype_enum", source: "param.compute_dtype", default: "fp16" }

  # ---- vector: shape ----

  vector_transpose:
    unit: vector
    params:
      - { name: "input", type: "tensor_desc", source: "tensor.input_0" }
      - { name: "out",   type: "tensor_desc", source: "tensor.output_0" }
      - { name: "ndim",  type: "int",         source: "tensor.input_0.ndim" }
      - { name: "dims",  type: "int_array",   source: "tensor.input_0.shape" }
      - { name: "dim0",  type: "int",         source: "param.dim0" }
      - { name: "dim1",  type: "int",         source: "param.dim1" }
      - { name: "compute_dtype", type: "dtype_enum", source: "param.compute_dtype", default: "fp16" }

  vector_transpose_2d:
    unit: vector
    params:
      - { name: "input", type: "tensor_desc", source: "tensor.input_0" }
      - { name: "out",   type: "tensor_desc", source: "tensor.output_0" }
      - { name: "rows",  type: "int",         source: "tensor.input_0.shape.0" }
      - { name: "cols",  type: "int",         source: "tensor.input_0.shape.1" }
      - { name: "compute_dtype", type: "dtype_enum", source: "param.compute_dtype", default: "fp16" }

dma_ops:

  # 格式/dtype 转换（HBM ↔ L1 或 L1 内部）
  dma_reformat:
    unit: dma
    params:
      - { name: "input", type: "tensor_desc", source: "tensor.input_0" }
      - { name: "out",   type: "tensor_desc", source: "tensor.output_0" }
      - { name: "size_bytes", type: "int",    source: "tensor.input_0.hbm_size" }

  # 统一的 DMA 传输接口（HBM ↔ L1），支持随路 dtype 转换
  dma_move:
    unit: dma
    params:
      - { name: "dst",        type: "tensor_desc", source: "tensor.output_0" }
      - { name: "src",        type: "tensor_desc", source: "tensor.input_0" }
      - { name: "size_bytes", type: "int",         source: "tensor.input_0.hbm_size" }

idma_ops:

  # L1 → pipe 内部数据搬运
  idma_move:
    unit: idma
    params:
      - { name: "dst",        type: "tensor_desc", source: "tensor.output_0" }
      - { name: "src",        type: "tensor_desc", source: "tensor.input_0" }
      - { name: "size_bytes", type: "int",         source: "tensor.input_0.hbm_size" }

  idma_reshape:
    unit: idma
    params:
      - { name: "input", type: "tensor_desc", source: "tensor.input_0" }
      - { name: "out",   type: "tensor_desc", source: "tensor.output_0" }
      - { name: "size",  type: "int",         source: "tensor.input_0.hbm_size" }

  idma_broadcast:
    unit: idma
    params:
      - { name: "input",     type: "tensor_desc", source: "tensor.input_0" }
      - { name: "out",       type: "tensor_desc", source: "tensor.output_0" }
      - { name: "src_count", type: "int",         source: "tensor.input_0.elem_count" }
      - { name: "dst_count", type: "int",         source: "tensor.output_0.elem_count" }

  idma_concat:
    unit: idma
    params:
      - { name: "inputs", type: "tensor_desc_array", source: "tensor.inputs" }
      - { name: "counts", type: "int_array",         source: "tensor.input_counts" }
      - { name: "num_inputs", type: "int",            source: "tensor.num_inputs" }
      - { name: "out",   type: "tensor_desc",        source: "tensor.output_0" }
