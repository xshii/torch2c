memory:
  hbm:
    total_size_bytes: 4294967296
    alignment_bytes: 512
  l2:
    total_size_bytes: 33554432
    alignment_bytes: 256
  l1:
    total_size_bytes: 16777216   # 16 MB
    alignment_bytes: 32

fractal:
  cube_size: 16
  c0_by_dtype:
    fp16: 16
    int8: 32

dma:
  supports_format_convert: true
  supports_dtype_cast: false
  max_transfer_size_bytes: 1048576

format_capabilities:
  cube:
    src0: [zz, nd]       # 激活：Fractal_Z 优先（硬件原生），ND 兼容
    src1: nz              # 权重：必须 Fractal_NZ
    dst: [zz, nz, nd]    # 输出：优先分形格式（ZZ>NZ>ND）
  vector:
    src: [nd]             # Vector 仅支持 ND
    dst: [nd]
  idma:
    src: [nd, nz, zz, nn]  # IDMA 支持所有格式（随路转换）
    dst: [nd, nz, zz, nn]

mha_merge:
  prefer_merged_threshold: 0.9  # split 必须便宜 >10% 才触发
  max_batch_for_split: 1        # B>1 保持 merged
  matmul_launch_cycles: 100     # 仅此参数为 mha_merge 独有

block_pad:
  # 二维对齐表: format → dtype → [dim[-2]对齐, dim[-1]对齐]
  # 分形格式 (NZ/ZZ/NN) 的块尺寸由 cube_size 和 c0 决定
  # ND 格式 dim[-2] 通常为 1（不对齐），dim[-1] 按 SIMD 宽度对齐
  alignment:
    nd:
      fp16: [1, 16]
      fp32: [1, 16]
      bf16: [1, 16]
      int8: [1, 32]
      int32: [1, 16]
    nz:                    # Fractal_NZ: 列优先块, 行=c0, 列=cube_size
      fp16: [16, 16]
      fp32: [16, 16]
      bf16: [16, 16]
      int8: [32, 16]
      int32: [16, 16]
    zz:                    # Fractal_Z: 行优先块, 行=cube_size, 列=c0
      fp16: [16, 16]
      fp32: [16, 16]
      bf16: [16, 16]
      int8: [16, 32]
      int32: [16, 16]
    nn:                    # 列优先块, 行=c0, 列=cube_size (同 NZ 块形状)
      fp16: [16, 16]
      fp32: [16, 16]
      bf16: [16, 16]
      int8: [32, 16]
      int32: [16, 16]
  fallback: [16, 16]      # 未匹配的 format×dtype 组合兜底
  single_dim: 256          # 1D tensor 对齐（无分形结构）

compute:
  cube_ops_per_cycle: 4096     # 16x16x16 MAC
  vector_ops_per_cycle: 128    # SIMD 宽度
  dma_bytes_per_cycle: 256     # DMA 带宽 bytes/cycle

local_bypass:
  allowed_pairs:
    - ["cube", "vector"]
    - ["cube", "idma"]
    - ["idma", "vector"]
    - ["vector", "vector"]

pipe_bypass:
  pipe_pairs:
    - ["cube", "vector"]
