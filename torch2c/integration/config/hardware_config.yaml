memory:
  hbm:
    total_size_bytes: 4294967296
    alignment_bytes: 512
  l2:
    total_size_bytes: 33554432
    alignment_bytes: 256
  l1:
    total_size_bytes: 16777216   # 16 MB
    alignment_bytes: 32

fractal:
  cube_size: 16
  c0_by_dtype:
    fp16: 16
    int8: 32

dma:
  supports_format_convert: true
  supports_dtype_cast: false
  max_transfer_size_bytes: 1048576

format_capabilities:
  cube:
    src0: [nd, zz]       # 激活：ND 或 Fractal_Z
    src1: nz              # 权重：必须 Fractal_NZ
    dst: [nd, nz, zz]
  vector:
    src: [nd]             # Vector 仅支持 ND
    dst: [nd]
  idma:
    src: [nd, nz, zz, nn]  # IDMA 支持所有格式（随路转换）
    dst: [nd, nz, zz, nn]

mha_merge:
  prefer_merged_threshold: 0.9  # split 必须便宜 >10% 才触发
  max_batch_for_split: 1        # B>1 保持 merged
  matmul_launch_cycles: 100     # 仅此参数为 mha_merge 独有

block_pad:
  default:
    last_dim: 16           # ndim>=2: 最后 1 维对齐到的倍数
    last_two_product: 256  # ndim>=2: 最后 2 维乘积对齐到的倍数
    # single_dim: 256      # ndim==1: 唯一维度对齐（省略时 = last_two_product）
  by_dtype:
    # 特定 dtype 覆盖默认值，缺失字段回退 default
    # int8:
    #   last_dim: 32
    #   last_two_product: 1024

compute:
  cube_ops_per_cycle: 4096     # 16x16x16 MAC
  vector_ops_per_cycle: 128    # SIMD 宽度
  dma_bytes_per_cycle: 256     # DMA 带宽 bytes/cycle

local_bypass:
  allowed_pairs:
    - ["cube", "vector"]
    - ["cube", "idma"]
    - ["idma", "vector"]
    - ["vector", "vector"]

pipe_bypass:
  pipe_pairs:
    - ["cube", "vector"]
