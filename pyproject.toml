[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "npu-compiler"
version = "0.1.0"
description = "PyTorch to NPU C Code Offline Compiler"
requires-python = "==3.10.*"
dependencies = [
    "torch>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["torch2c*"]

[tool.pytest.ini_options]
testpaths = ["torch2c"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ── Ruff (lint + format) ──────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["torch2c"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RET",  # flake8-return
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long — formatter handles this
    "RET504", # unnecessary assignment before return
    "PT011",  # pytest.raises too broad
    "N802",   # function name should be lowercase (ATen ops use caps)
    "N803",   # argument name should be lowercase
    "N806",   # variable in function should be lowercase
    "UP015",  # unnecessary open mode 'r'
    "RUF001", # ambiguous unicode — project uses Chinese comments
    "RUF002", # ambiguous unicode in docstring
    "RUF003", # ambiguous unicode in comment
]

[tool.ruff.lint.isort]
known-first-party = ["torch2c"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy ──────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
packages = ["torch2c"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
