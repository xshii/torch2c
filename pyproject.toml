[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "npu-compiler"
version = "0.1.0"
description = "PyTorch to NPU C Code Offline Compiler"
requires-python = "==3.10.*"
dependencies = [
    "torch>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
include = ["npu_compiler*"]

[tool.pytest.ini_options]
testpaths = ["npu_compiler"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
